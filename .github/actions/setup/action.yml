name: setup
description: Install Node, pnpm, and dependencies for the root workspace and dashboard
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          dashboard/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm install --frozen-lockfile
      working-directory: dashboard
      shell: bash
