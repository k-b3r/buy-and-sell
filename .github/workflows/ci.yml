name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bas_test

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup
      # Every check runs even after one fails, so a single push reports them all.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm format:check
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm depcruise
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm knip
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm docs:check
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm repo-checks commits origin/${{ github.base_ref }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm repo-checks escape-hatches origin/${{ github.base_ref }}

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test
